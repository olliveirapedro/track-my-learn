services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-track_my_learn}
      POSTGRES_USER: ${POSTGRES_USER:-track_my_learn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Descomente só para desenvolver pela IDE (app fora do Docker).
    # Na VM, deixe comentado para não expor o banco.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-track_my_learn} -d ${POSTGRES_DB:-track_my_learn}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Na VM: imagem vinda do GHCR (troque SEU_USUARIO pelo seu usuário do GitHub, em minúsculas).
    # Local: `docker compose up --build` usa o Dockerfile.
    image: ghcr.io/olliveirapedro/track-my-learn:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" é o nome do serviço acima: o Compose resolve como hostname na rede interna
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-track_my_learn}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-track_my_learn}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pgdata: